<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>급식실 실시간 대기 현황 (세밀한 조절)</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --primary-color: #4A90E2;
            --text-color: #333333;
            --success-color: #2ECC71;
            --warning-color: #F1C40F;
            --danger-color: #E74C3C;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            margin: 0;
            color: #1a1a1a;
        }

        .status-box {
            background-color: #eef7ff;
            border: 2px solid var(--primary-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .status-title {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 8px;
        }

        .wait-time-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-color);
            margin: 5px 0;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            background-color: var(--primary-color);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .info-card {
            background-color: #f1f3f5;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
        }

        .info-label {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .control-panel {
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .control-title {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #555;
        }

        /* 미세 조절 버튼 그룹 */
        .btn-group {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button.btn-sub {
            background-color: #868e96;
        }

        button.btn-clear {
            background-color: #fa5252;
        }

        /* 슬라이더 및 직접 입력 제어 영역 */
        .input-control-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .direct-input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .direct-input-group label {
            font-size: 0.85rem;
            color: #495057;
            font-weight: 600;
        }

        .direct-input-group input[type="number"] {
            width: 80px;
            padding: 6px 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1rem;
            text-align: right;
            font-weight: bold;
        }

        .slider-container input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>🍱 급식실 실시간 대기 현황</h1>
    </div>

    <!-- 대기 시간 메인 표시 영역 -->
    <div class="status-box" id="statusBox">
        <div class="status-title">예상 대기 시간</div>
        <div class="wait-time-display"><span id="waitTime">0</span>분</div>
        <div class="status-badge" id="statusBadge">원활</div>
    </div>

    <!-- 세부 정보 Grid -->
    <div class="info-grid">
        <div class="info-card">
            <div class="info-label">현재 대기 인원</div>
            <div class="info-value" id="queueLength">0 명</div>
        </div>
        <div class="info-card">
            <div class="info-label">분당 처리 인원</div>
            <div class="info-value">약 10 명</div>
        </div>
    </div>

    <!-- 미세 조절 및 슬라이더 제어판 -->
    <div class="control-panel">
        <div class="control-title">⚙️ 실시간 인원 세밀 조절</div>

        <!-- 슬라이더 및 직접 입력 -->
        <div class="input-control-box">
            <div class="direct-input-group">
                <label for="numInput">직접 인원 입력:</label>
                <div>
                    <input type="number" id="numInput" value="0" min="0" max="200" oninput="onDirectInput(this.value)"> 명
                </div>
            </div>
            <div class="slider-container">
                <input type="range" id="queueSlider" min="0" max="100" value="0" step="1" oninput="onSliderChange(this.value)">
            </div>
        </div>

        <!-- 1명, 3명, 5명 미세 버튼 -->
        <div class="btn-group">
            <button class="btn-sub" onclick="changeQueue(-5)">-5명</button>
            <button class="btn-sub" onclick="changeQueue(-3)">-3명</button>
            <button class="btn-sub" onclick="changeQueue(-1)">-1명</button>
            <button onclick="changeQueue(1)">+1명</button>
            <button onclick="changeQueue(3)">+3명</button>
            <button onclick="changeQueue(5)">+5명</button>
        </div>

        <div class="btn-group">
            <button class="btn-clear" onclick="setPreset(0)">초기화 (0명)</button>
        </div>
    </div>
</div>

<script>
    // 시스템 변수
    let queueCount = 0;
    const processRatePerMinute = 10; // 분당 처리 인원 수

    // 대기시간 계산 및 UI 전체 업데이트 함수
    function updateDashboard() {
        // 예상 대기 시간 계산 (올림 처리)
        let calculatedTime = Math.ceil(queueCount / processRatePerMinute);
        
        // 인원이 1명 이상일 때 최소 1분 표시
        if (queueCount > 0 && calculatedTime === 0) {
            calculatedTime = 1;
        }

        // 텍스트 및 입력창 동기화
        document.getElementById('queueLength').innerText = `${queueCount} 명`;
        document.getElementById('waitTime').innerText = calculatedTime;
        document.getElementById('numInput').value = queueCount;
        document.getElementById('queueSlider').value = queueCount > 100 ? 100 : queueCount;

        // 엘리먼트 참조
        const statusBox = document.getElementById('statusBox');
        const statusBadge = document.getElementById('statusBadge');
        const waitTimeDisplay = document.querySelector('.wait-time-display');

        // 혼잡도 상태별 테마 변경
        if (calculatedTime <= 3) {
            // 원활 (초록색)
            statusBox.style.backgroundColor = '#eefbf4';
            statusBox.style.borderColor = '#2ECC71';
            statusBadge.style.backgroundColor = '#2ECC71';
            statusBadge.innerText = '원활';
            waitTimeDisplay.style.color = '#27AE60';
        } else if (calculatedTime <= 8) {
            // 보통 (노란색/주황색)
            statusBox.style.backgroundColor = '#fffdf0';
            statusBox.style.borderColor = '#F1C40F';
            statusBadge.style.backgroundColor = '#F39C12';
            statusBadge.innerText = '보통';
            waitTimeDisplay.style.color = '#D35400';
        } else {
            // 혼잡 (빨간색)
            statusBox.style.backgroundColor = '#fdf2f2';
            statusBox.style.borderColor = '#E74C3C';
            statusBadge.style.backgroundColor = '#E74C3C';
            statusBadge.innerText = '혼잡';
            waitTimeDisplay.style.color = '#C0392B';
        }
    }

    // 증감 버튼 실행 함수
    function changeQueue(delta) {
        queueCount += delta;
        if (queueCount < 0) queueCount = 0;
        updateDashboard();
    }

    // 직접 입력창 변경 시
    function onDirectInput(val) {
        let parsedVal = parseInt(val);
        if (isNaN(parsedVal) || parsedVal < 0) parsedVal = 0;
        queueCount = parsedVal;
        updateDashboard();
    }

    // 슬라이더 이동 시
    function onSliderChange(val) {
        queueCount = parseInt(val);
        updateDashboard();
    }

    // 초기화 함수
    function setPreset(count) {
        queueCount = count;
        updateDashboard();
    }

    // 초기 로드
    updateDashboard();
</script>

</body>
</html>
